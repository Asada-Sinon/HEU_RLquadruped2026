# Paths are resolved relative to the repository root unless absolute.
urdf_path: source/rl_first/rl_first/assets/robot/my_quad/my_12dof_quadruped.urdf
# Update this after retraining/exporting the 135-dim IMU-only policy, or pass --policy.
policy_path: logs/rsl_rl/my_quad_sim2real_imu_v1/latest/exported/policy.onnx

simulation:
  physics_dt: 0.005
  control_dt: 0.02
  add_free_joint_if_missing: true
  add_ground_if_missing: true
  ground_size: [100.0, 100.0, 0.01]
  initial_base_pos: [0.0, 0.0, 0.37]
  initial_base_quat_wxyz: [1.0, 0.0, 0.0, 0.0]

policy:
  observation_dim: 135
  base_observation_dim: 45
  observation_history_length: 3
  action_dim: 12
  action_scale: 0.2
  default_command: [0.2, 0.0, 0.0]
  command_step:
    linear: 0.05
    angular: 0.05
  command_limits:
    lin_vel_x: [-0.25, 0.45]
    lin_vel_y: [-0.10, 0.10]
    ang_vel_z: [-0.35, 0.35]

control:
  kp: 20.0
  kd: 0.4
  torque_limit: 23.7

joint_order:
  - LF_HAA
  - LH_HAA
  - RF_HAA
  - RH_HAA
  - LF_HFE
  - LH_HFE
  - RF_HFE
  - RH_HFE
  - LF_KFE
  - LH_KFE
  - RF_KFE
  - RH_KFE

default_joint_pos:
  LF_HAA: -0.027960174616949163
  LF_HFE: 1.0191152035320088
  LF_KFE: -1.5190473144732646
  RF_HAA: 0.027960174616949163
  RF_HFE: 1.0191152035320088
  RF_KFE: -1.5190473144732646
  LH_HAA: -0.027960174616949163
  LH_HFE: 1.0191152035320088
  LH_KFE: -1.5190473144732646
  RH_HAA: 0.027960174616949163
  RH_HFE: 1.0191152035320088
  RH_KFE: -1.5190473144732646
